{% set version = "24.7.1" %}
{% set build_number = 5 %}
{% set name = "conda-launchers" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://raw.githubusercontent.com/conda/{{ name }}/{{ version }}-{{ build_number }}/src/cpython-launcher-c-mods-for-setuptools.3.7.patch
    sha256: 354bb81b5a5c059678f3dfc36a6cbba84714ca180b1cadef7b300d0cb327bb51
  - url: https://raw.githubusercontent.com/conda/{{ name }}/{{ version }}-{{ build_number }}/src/launcher.manifest
    sha256: 9ec47595697628058434c8b056c581aefce247c4d774d5392cf6e74fd04075be
  - url: https://raw.githubusercontent.com/conda/{{ name }}/{{ version }}-{{ build_number }}/src/LICENSE
    sha256: 6df75cebd33d62bc1e0e62ee6431c272aad9c07648853eed3c460ebf1a0c0488
  - url: https://raw.githubusercontent.com/python/cpython/3.7/PC/launcher.c
    sha256: a3167e5908cefa942f63e0de5c6ec7a929e8ca82a382537ab8292e5aaa82ca2e
    fn: launcher.c.orig
  - url: https://raw.githubusercontent.com/python/cpython/3.7/LICENSE
    sha256: 96e4f59524cde5af4a2ea837ef5e52b65e51f1f999825fd8a9ec3b444cb82aea
    fn: cpython-LICENSE

build:
  number: {{ build_number }}
  skip: true  # [not win]
  ignore_run_exports:
    - {{ compiler("c") }}  # [win and arm64]
    - {{ stdlib("c") }}    # [win and arm64]
    - ucrt64-gcc-libs      # [win and x86_64]

requirements:
  build:
    - ucrt64-gcc-toolchain_win-64  # [win and x86_64]
    - msys2-bash                     # [win and x86_64]
    - {{ compiler("c") }}            # [win and arm64]
    - {{ stdlib("c") }}              # [win and arm64]
  run: []

test:
  requires:
    - python
  commands:
    - if not exist "%PREFIX%\\share\\conda-launchers\\cli-64.exe" exit /b 1      # [win and x86_64]
    - if not exist "%PREFIX%\\share\\conda-launchers\\gui-64.exe" exit /b 1      # [win and x86_64]
    - if not exist "%PREFIX%\\share\\conda-launchers\\cli-arm64.exe" exit /b 1  # [win and arm64]
    - if not exist "%PREFIX%\\share\\conda-launchers\\gui-arm64.exe" exit /b 1  # [win and arm64]
    - if not exist "%PREFIX%\\Scripts" mkdir "%PREFIX%\\Scripts"  # [win]
    - copy /Y "%PREFIX%\\share\\conda-launchers\\cli-64.exe" "%PREFIX%\\Scripts\\"  # [win and x86_64]
    - cd /d "%PREFIX%\\Scripts" && (echo from pathlib import Path> cli-64-script.py && echo print("ok")>> cli-64-script.py && echo Path("cli-64-output.txt").write_text("ok")>> cli-64-script.py)  # [win and x86_64]
    - set PYLAUNCH_DEBUG=1 && cd /d "%PREFIX%\\Scripts" && cli-64.exe  # [win and x86_64]
    - if not exist "%PREFIX%\\Scripts\\cli-64-output.txt" exit /b 1  # [win and x86_64]
    - copy /Y "%PREFIX%\\share\\conda-launchers\\cli-arm64.exe" "%PREFIX%\\Scripts\\"  # [win and arm64]
    - cd /d "%PREFIX%\\Scripts" && (echo from pathlib import Path> cli-arm64-script.py && echo print("ok")>> cli-arm64-script.py && echo Path("cli-arm64-output.txt").write_text("ok")>> cli-arm64-script.py)  # [win and arm64]
    - set PYLAUNCH_DEBUG=1 && cd /d "%PREFIX%\\Scripts" && cli-arm64.exe  # [win and arm64]
    - if not exist "%PREFIX%\\Scripts\\cli-arm64-output.txt" exit /b 1  # [win and arm64]

about:
  home: https://github.com/conda/conda-launchers
  summary: Conda's Windows launchers for Python entry points, built from upstream sources
  description: |
    Windows launchers for Python entry points used in the conda ecosystem.

    In order to launch Python entrypoints properly on Windows, a corresponding
    executable is used to proxy the call because shebangs do not work on Windows.
    This is achieved by the launchers (or called shims).

    Each platform package ships only the launchers for that architecture:
    `win-64` builds with ucrt64 GCC, `win-arm64` builds natively with MSVC.
    Both apply the upstream patch to CPython's launcher.c at build time.
  license: Python-2.0 AND BSD-3-Clause
  license_family: BSD
  license_file:
    - cpython-LICENSE
    - LICENSE
  dev_url: https://github.com/conda/conda-launchers
  doc_url: https://github.com/conda/conda-launchers/blob/main/README.md

extra:
  recipe-maintainers:
    - jaimergp
    - jezdez
