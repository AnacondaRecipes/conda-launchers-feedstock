{% set version = "24.7.1" %}
{% set build_number = 5 %}
{% set name = "conda-launchers" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # Licenses
  - url: https://raw.githubusercontent.com/python/cpython/3.7/LICENSE
    sha256: 96e4f59524cde5af4a2ea837ef5e52b65e51f1f999825fd8a9ec3b444cb82aea
    fn: cpython-LICENSE
  - url: https://raw.githubusercontent.com/conda/{{ name }}/{{ version }}-{{ build_number }}/src/LICENSE
    sha256: 6df75cebd33d62bc1e0e62ee6431c272aad9c07648853eed3c460ebf1a0c0488
  # -32 versions can only be compiled with zig so we use those for both variants
  - url: https://github.com/conda/{{ name }}/releases/download/{{ version }}-{{ build_number }}/cli-32-{{ version }}-90b98ef_zig_{{ build_number }}.exe
    sha256: 3856b8e5971a9238eae5608701fc2694dd2f2084122ce3ba8eae400fc2314599
  - url: https://github.com/conda/{{ name }}/releases/download/{{ version }}-{{ build_number }}/gui-32-{{ version }}-90b98ef_zig_{{ build_number }}.exe
    sha256: ecfb19aec39ca631846acee20da1e337437c54b157d1c6db3ff0ede2ea8debf6

  # GCC variant
  - url: https://github.com/conda/{{ name }}/releases/download/{{ version }}-{{ build_number }}/cli-64-{{ version }}-e8b2e36_gcc_{{ build_number }}.exe # [compiled_with == "gcc"]
    sha256: 4d8c479577961d0c6d940966f7987fbb0d6fc98b80edc03b00ee949dd8c1b3e2 # [compiled_with == "gcc"]
  - url: https://github.com/conda/{{ name }}/releases/download/{{ version }}-{{ build_number }}/gui-64-{{ version }}-e8b2e36_gcc_{{ build_number }}.exe # [compiled_with == "gcc"]
    sha256: 1ebb2934a75dd3aa5845ec77f7c257a903dacfc3b77e1b893f61f8f281a7d9a9 # [compiled_with == "gcc"]
  - url: https://github.com/conda/{{ name }}/releases/download/{{ version }}-{{ build_number }}/cli-arm64-{{ version }}-642fc7c_vs2022_{{ build_number }}.exe # [compiled_with == "gcc"]
    sha256: 883bb0599ad5624acc664c320388a07ffb4f23eec7e0cd29194a9450ff928267 # [compiled_with == "gcc"]
  - url: https://github.com/conda/{{ name }}/releases/download/{{ version }}-{{ build_number }}/gui-arm64-{{ version }}-642fc7c_vs2022_{{ build_number }}.exe # [compiled_with == "gcc"]
    sha256: 50c810f190be9fa7f63a829c87e54d265b6aa0d2ac3be6b680030b37a57208ca # [compiled_with == "gcc"]

  # Zig variant
  - url: https://github.com/conda/{{ name }}/releases/download/{{ version }}-{{ build_number }}/cli-64-{{ version }}-ed4fef8_zig_{{ build_number }}.exe # [compiled_with == "zig"]
    sha256: 860c80fb193d675d4a7b1818f7a93a8df2252982fa2bb0b0b35182f5911f25ff # [compiled_with == "zig"]
  - url: https://github.com/conda/{{ name }}/releases/download/{{ version }}-{{ build_number }}/cli-arm64-{{ version }}-53f4ca0_zig_{{ build_number }}.exe # [compiled_with == "zig"]
    sha256: 3833045196b8fcc6e1a58b92cd402af3db8752e9f7d9686e245fd217c08dd244 # [compiled_with == "zig"]
  - url: https://github.com/conda/{{ name }}/releases/download/{{ version }}-{{ build_number }}/gui-64-{{ version }}-ed4fef8_zig_{{ build_number }}.exe # [compiled_with == "zig"]
    sha256: 873e31ae9b345d111320aedc7585647190585f849e6154ee36c829bc3eb5c41c # [compiled_with == "zig"]
  - url: https://github.com/conda/{{ name }}/releases/download/{{ version }}-{{ build_number }}/gui-arm64-{{ version }}-53f4ca0_zig_{{ build_number }}.exe # [compiled_with == "zig"]
    sha256: 0ba40321aec0c22cbc11ac6d7f82668ec756d5d882c1e2c5b9e4033606af1d32 # [compiled_with == "zig"]

build:
  number: {{ build_number }}
  string: {{ PKG_HASH }}_{{ compiled_with }}_{{ build_number }}
  noarch: generic

about:
  home: https://github.com/conda/conda-launchers
  summary: "Conda's Windows launchers for Python entry points, repackaged from upstream releases"
  description: |
    Windows launchers for Python entry points used in the conda ecosystem
    In order to launch Python entrypoints properly on Windows, a corresponding
    executable is used to proxy the call because shebangs do not work on Windows.
    This is achieved by the launchers (or called shims).
  license: Python-2.0 AND BSD-3-Clause
  license_family: BSD
  license_file:
    - cpython-LICENSE
    - LICENSE
  dev_url: https://github.com/conda/conda-launchers
  doc_url: https://github.com/conda/conda-launchers/blob/main/README.md

extra:
  recipe-maintainers:
    - jaimergp
    - jezdez
